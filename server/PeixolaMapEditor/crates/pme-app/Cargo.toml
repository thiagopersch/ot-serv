[package]
name = "peixola_map_editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "PeixolaMapEditor"
path = "src/main.rs"

[dependencies]
pme-core.workspace = true
pme-io.workspace = true
ahash.workspace = true
anyhow.workspace = true
log.workspace = true
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
egui_extras = { version = "=0.31.1" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# xBRZ pixel-art upscaler (Rust port of xBRZ 1.8, GPL-3.0) — same algorithm as the client's HD Mode.
xbrz-rs = "0.1"
env_logger = "0.11"
